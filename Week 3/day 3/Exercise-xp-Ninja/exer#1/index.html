<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tip Calculator</title>
</head>
<body>

    <div>
        <h1>Tip Calculator</h1>

        <label for="billAmt">Bill Amount</label>
        <input type="number" id="billAmt" placeholder="Enter bill amount">

        <br><br>

        <label for="serviceQual">Service Quality</label>
        <select id="serviceQual">
            <option value="0">Choose...</option>
            <option value="0.30">30% - Outstanding</option>
            <option value="0.20">20% - Good</option>
            <option value="0.15">15% - It was okay</option>
            <option value="0.10">10% - Bad</option>
        </select>

        <br><br>

        <label for="numOfPeople">Number of People</label>
        <input type="number" id="numOfPeople" placeholder="Number of people">

        <br><br>

        <button id="calculate">Calculate</button>

        <div id="totalTip" style="display: none;">
            <p>Tip per person:</p>
            <span id="tip"></span>
        </div>

    </div>

    <script src="main.js"></script>
</body>
</html>
