<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Solar System</title>

    <style>
        body {
            background-color: black;
            padding: 10px;
            margin: 0;
            color: white;
            font-family: Arial, sans-serif;
        }

        h1 {
            text-align: center;
        }

        .listPlanets {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 80px;
            padding: 80px 20px;
        }

        .planet {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            text-align: center;
            padding: 10px;
            position: relative;
            border: 2px solid white;

            display: flex;
            align-items: center;
            justify-content: center;

            color: white;
            font-weight: bold;
        }

        .moon {
            position: absolute;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: rgb(237, 237, 237);
            border: 5px solid red;
        }
    </style>
</head>

<body>

    <h1>Solar System</h1>

    <section class="listPlanets"></section>

    <!-- JavaScript file -->
    <script src="script.js"></script>

</body>
</html>
