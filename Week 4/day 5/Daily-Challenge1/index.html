<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Giphy Random Search</title>
    <style>
        #gif-container {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            margin-top: 20px;
        }
        .gif-item {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .gif-item img {
            width: 200px;
        }
        .gif-item button {
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <h1>Giphy Random Gif Search</h1>

    <form id="gif-form">
        <input type="text" id="gif-input" placeholder="Search a category..." required>
        <button type="submit">Search</button>
    </form>

    <button id="delete-all-btn">DELETE ALL</button>

    <div id="gif-container"></div>

    <script src="script.js"></script>
</body>
</html>
